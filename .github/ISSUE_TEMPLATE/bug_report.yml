name: Bug report
description: Report a reproducible Aura problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the exact command/action and what you expected.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Aura doctor output
      description: Paste `bin/aura-cycler doctor` output. Review/redact any local paths you consider private before posting.
      render: text
  - type: textarea
    id: hardware
    attributes:
      label: Aura hardware capability output
      description: Paste `bin/aura-cycler hardware`. This reports detected GPU/keyboard backends without hostnames or private location data.
      render: json
  - type: input
    id: omarchy
    attributes:
      label: Omarchy version
  - type: input
    id: machine
    attributes:
      label: Laptop / desktop model (optional)
      description: Helpful for vendor-specific hardware bugs; leave blank if you prefer.
  - type: input
    id: gpu
    attributes:
      label: GPU / driver
  - type: input
    id: keyboard
    attributes:
      label: Keyboard / RGB hardware
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Review local file paths/location information before posting publicly.
      render: text

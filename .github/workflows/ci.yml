name: CI

on:
  push:
    branches: ["master", "audit-hardening-v1.4"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install --require-hashes -r requirements.lock

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            bin/aura-cycler \
            bin/aura-cycler-core \
            bin/aura-cycler-service-guard

      - name: Validate manifest
        run: |
          python -m json.tool manifest.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          m = json.loads(Path("manifest.json").read_text())
          assert m["schemaVersion"] == 1
          assert m["id"] == "harshith.aura-cycler"
          assert m["version"] == "1.4.0"
          assert set(m["kinds"]) == {"service", "bar-widget"}
          assert m["barWidget"]["allowMultiple"] is False
          for path in m["entryPoints"].values():
              p = Path(path)
              assert not p.is_absolute()
              assert ".." not in p.parts
              assert p.is_file(), path
          PY

      - name: Run regression tests
        run: pytest -q

      - name: Optional QML lint
        shell: bash
        run: |
          if command -v qmllint >/dev/null 2>&1; then
            qmllint BarWidget.qml Panel.qml WeatherService.qml
          else
            echo "qmllint not installed on runner; skipping"
          fi
